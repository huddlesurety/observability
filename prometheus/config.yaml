# Template file — ${VAR} placeholders are substituted by entrypoint.sh via sed.
# Prometheus does not support env var expansion natively (v3).

global:
  scrape_interval: ${SCRAPE_INTERVAL}
  evaluation_interval: ${EVALUATION_INTERVAL}

# Recording rules that pre-aggregate the high-churn `instance` label off the
# series the dashboards read. See rules.yaml for the why and the measurements.
rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  # Scrapes Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
